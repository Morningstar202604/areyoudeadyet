version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

    ignore:
      - dependency-name: "androidx.health.connect:connect-client"
      - dependency-name: "androidx.navigation:navigation-compose"
        versions: [">=2.10.0"]
      - dependency-name: "androidx.lifecycle:lifecycle-runtime-compose"
        versions: [">=2.10.0"]
      - dependency-name: "androidx.lifecycle:lifecycle-viewmodel-compose"
        versions: [">=2.10.0"]
      # 以下依赖需要 compileSdk 37 / AGP 9.x，当前工具链为 compileSdk 36 / AGP 8.13.2，
      # 待 AGP 9 迁移完成后移除对应 ignore 放行（跟踪见 #15）
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">=2026.08.00"]
      - dependency-name: "gradle"
        versions: [">=9.6.0"]
      # Kotlin 2.4 生成元数据 2.4.0，Hilt 内置的 kotlin-metadata-jvm 只读到 2.3.0；
      # 能读 2.4 的 Hilt 2.58+ 又强制 AGP 9 —— AGP 9 迁移（#15）完成后再放行
      - dependency-name: "org.jetbrains.kotlin*"
        versions: [">=2.4.0"]
      - dependency-name: "com.google.dagger.hilt.android"
        versions: [">=2.58.0"]
