name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile app (debug)
        run: ./gradlew :app:compileDebugKotlin --no-daemon --console=plain --stacktrace

      - name: Run unit tests (app)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Run unit tests (wear)
        run: ./gradlew :wear:testDebugUnitTest --no-daemon --console=plain

      - name: Build debug APK (app)
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Build debug APK (wear)
        run: ./gradlew :wear:assembleDebug --no-daemon --console=plain

      - name: Build release APK (verify ProGuard rules)
        run: |
          ./gradlew :app:assembleRelease --no-daemon --console=plain
          ./gradlew :wear:assembleRelease --no-daemon --console=plain

      - name: Lint check
        run: ./gradlew :app:lint --no-daemon --console=plain
        continue-on-error: true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            wear/build/outputs/apk/debug/wear-debug.apk
            wear/build/outputs/apk/release/wear-release-unsigned.apk

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            wear/build/reports/tests/testDebugUnitTest/
