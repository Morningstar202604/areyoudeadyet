name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Run algorithm tests (33 cases)
        run: |
          STDLIB=$(find ~/.gradle -name "kotlin-stdlib-2.0.21.jar" | grep -v sources | head -1)
          SERCORE=$(find ~/.gradle -name "kotlinx-serialization-core-jvm-1.7.3.jar" | grep -v sources | head -1)
          COROUTINES=$(find ~/.gradle -name "kotlinx-coroutines-core-jvm-*.jar" | grep -v sources | head -1)
          CP="app/build/tmp/kotlin-classes/debug:$STDLIB:$SERCORE:$COROUTINES"
          java -cp "$CP" test/TestEngine.java
          java -cp "$CP" test/TestStats.java
          java -cp "$CP" test/TestFeatures.java

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
